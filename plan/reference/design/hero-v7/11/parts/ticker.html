<style>
/* ── Ticker: what people type, rolling past in two directions ─────────
   Scroll speeds it up and leans it; scrolling back up turns it round. */
#ticker {
  position: relative; overflow: hidden;
  padding: clamp(18px, 2.4vw, 40px) 0 clamp(16px, 2.2vw, 36px);
  display: grid; gap: clamp(6px, 0.9vw, 14px);
  user-select: none;
}
#ticker .tk-row { position: relative; overflow: hidden; }
#ticker .tk-track {
  display: flex; width: max-content; will-change: transform;
}
#ticker .tk-set { display: flex; align-items: center; flex: none; }
#ticker .tk-item {
  display: inline-flex; align-items: center; flex: none;
  font: 700 clamp(40px, 5.7vw, 96px)/1 var(--display);
  letter-spacing: -0.045em; text-transform: uppercase; white-space: nowrap;
  padding-right: 0.32em;
}
#ticker .tk-chip {
  display: inline-grid; place-items: center; flex: none;
  width: 0.78em; height: 0.78em; border-radius: 50%; margin-right: 0.32em;
  font-size: clamp(40px, 5.7vw, 96px);
  box-shadow: 0 10px 22px -12px rgb(11 13 16 / 0.45);
}
#ticker .tk-chip svg { width: 44%; height: 44%; }
#ticker .tk-chip.c-lime { background: var(--lime); color: var(--ink); }
#ticker .tk-chip.c-cob { background: var(--cobalt); color: #fff; }
#ticker .tk-chip.c-ink { background: var(--ink); color: var(--lime); }
#ticker .tk-chip.c-white { background: #fff; color: var(--cobalt); box-shadow: inset 0 0 0 1px var(--line), 0 10px 22px -14px rgb(11 13 16 / 0.35); }

#ticker .r1 .tk-item { color: var(--ink); }
/* The second row is drawn, not filled — it reads as the echo of the first. */
#ticker .r2 .tk-item {
  color: transparent;
  -webkit-text-stroke: clamp(1.2px, 0.11vw, 2px) var(--cobalt);
}
#ticker .r2 .tk-item.fill { color: var(--cobalt); -webkit-text-stroke: 0; }

@media (max-width: 900px) {
  #ticker { padding: 26px 0 22px; gap: 4px; }
}
</style>

<section id="ticker" aria-label="Example topics">
  <p class="sr-only">For example: espresso at home, Spanish for June, SQL for analysts, anatomy in six weeks, public speaking, beekeeping, balance sheets, Postgres performance, watercolour washes, sourdough science.</p>
  <div class="tk-row r1" aria-hidden="true"><div class="tk-track"></div></div>
  <div class="tk-row r2" aria-hidden="true"><div class="tk-track"></div></div>
</section>

<script>
(() => {
  const sec = document.getElementById('ticker');
  if (!sec) return;
  const STILL = document.documentElement.classList.contains('still');

  // Short forms of the hero's phrases and the dashboard's suggestions.
  const ROW1 = [
    ['Espresso at home', 'c-lime', 'i-spark'],
    ['SQL for analysts', 'c-cob', 'i-code'],
    ['Public speaking', 'c-ink', 'i-mic'],
    ['Balance sheets', 'c-white', 'i-table'],
    ['Watercolour washes', 'c-lime', 'i-wand'],
  ];
  const ROW2 = [
    ['Spanish for June', 'c-ink', 'i-chat'],
    ['Anatomy in six weeks', 'c-lime', 'i-book'],
    ['Beekeeping', 'c-cob', 'i-flame'],
    ['Postgres performance', 'c-white', 'i-sliders'],
    ['Sourdough science', 'c-lime', 'i-steps'],
  ];

  const setHTML = (items, row2) => items.map(([t, c, ic], i) =>
    `<span class="tk-chip ${c}"><svg><use href="#${ic}"/></svg></span>` +
    `<span class="tk-item${row2 && i % 2 ? ' fill' : ''}">${t}</span>`).join('');

  const rows = [...sec.querySelectorAll('.tk-row')].map((row, r) => {
    const track = row.querySelector('.tk-track');
    const html = setHTML(r ? ROW2 : ROW1, r === 1);
    // Enough copies to cover the widest screen twice over; one copy is the wrap length.
    track.innerHTML = `<span class="tk-set">${html}</span>`.repeat(3);
    return { track, dir: r ? 1 : -1, x: 0, w: 0 };
  });

  const measure = () => rows.forEach((o) => {
    o.w = o.track.firstElementChild.getBoundingClientRect().width;
    // Row two starts half a phrase in, so the chips never line up vertically.
    if (!o.x) o.x = o.dir > 0 ? -o.w * 0.37 : 0;
  });
  measure();
  addEventListener('resize', measure);
  if (document.fonts) { document.fonts.ready.then(measure); document.fonts.addEventListener('loadingdone', measure); }

  const place = () => rows.forEach((o) => {
    if (!o.w) return;
    // Wrap into (-w, 0]: the second copy takes over seamlessly.
    o.x = ((o.x % o.w) - o.w) % o.w;
    o.track.style.transform = `translate3d(${o.x.toFixed(2)}px,0,0) skewX(${skew.toFixed(2)}deg)`;
  });

  let skew = 0;
  if (STILL) { place(); return; }

  // Speed in px/s at rest; scrolling multiplies it and picks the direction.
  const BASE = innerWidth < 700 ? 38 : 62;
  let boost = 0, turn = 1, visible = false;
  const st = ScrollTrigger.create({
    trigger: sec, start: 'top bottom', end: 'bottom top',
    onToggle: (self) => { visible = self.isActive; },
    onUpdate: (self) => {
      const v = self.getVelocity();
      if (Math.abs(v) > 30) turn = v < 0 ? -1 : 1;
      boost = Math.max(boost, Math.min(9, Math.abs(v) / 260));
    },
  });
  visible = st.isActive;

  gsap.ticker.add((time, dt) => {
    if (!visible || document.hidden) return;
    const s = Math.min(dt, 50) / 1000;
    boost *= Math.pow(0.04, s);                     // settle back in ~1s
    const targetSkew = -Math.min(7, boost * 1.4) * turn;
    skew += (targetSkew - skew) * Math.min(1, s * 8);
    rows.forEach((o) => { o.x += o.dir * turn * BASE * (1 + boost) * s; });
    place();
  });
  place();
})();
</script>
