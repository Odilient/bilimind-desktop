# Publish the landing page (site/) to GitHub Pages: https://odilient.github.io/bilimind-desktop/
# Every path in site/index.html is relative, so the page works under the /bilimind-desktop/ sub-path.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble the site (showcase courses, skill zip, secret scan)
        run: node site/scripts/assemble.mjs

      - name: Copy site/ to _site (without screenshots, scripts and notes)
        run: |
          mkdir -p _site
          rsync -a \
            --exclude 'shots/' \
            --exclude 'scripts/' \
            --exclude 'NOTES*' \
            site/ _site/
          touch _site/.nojekyll
          ls -la _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
