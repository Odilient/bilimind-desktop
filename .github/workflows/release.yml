# Release BiliMind Desktop: push a tag like v0.2.0 and this builds the app on Windows, macOS and Linux, plus the
# single-file CLI, and attaches everything (with SHA256SUMS.txt) to a GitHub release whose body is
# .github/release-notes.md. The builds are not code-signed (see the README).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.2.0
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            files: apps/desktop/release/*.exe
          - os: macos-latest
            files: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
          - os: ubuntu-latest
            files: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the course player
        run: pnpm --filter @bilimind/player build

      - name: Package the desktop app
        working-directory: apps/desktop
        run: node scripts/dist.mjs

      - name: Bundle the CLI (one file, Node 22+)
        if: runner.os == 'Linux'
        run: |
          node apps/cli/scripts/bundle.mjs
          mkdir -p apps/desktop/release
          cp skills/bilimind/scripts/bilimind.mjs apps/desktop/release/bilimind-cli.mjs
          cp skills/bilimind/scripts/sql-wasm.wasm apps/desktop/release/sql-wasm.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          if-no-files-found: error
          path: |
            ${{ matrix.files }}
            apps/desktop/release/bilimind-cli.mjs
            apps/desktop/release/sql-wasm.wasm

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: BiliMind Desktop ${{ inputs.tag || github.ref_name }}
          body_path: .github/release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
          append_body: false
          generate_release_notes: false
          # a tag with a suffix (v0.3.0-rc.1) is a pre-release and never becomes "latest"
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          make_latest: ${{ !contains(inputs.tag || github.ref_name, '-') }}
